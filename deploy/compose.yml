name: talentai

services:
  app:
    image: ${APP_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Runtime secrets (Clerk, Stripe, AI keys, Supabase DATABASE_URL) come straight from .env
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '127.0.0.1:${APP_PORT}:3000'
    # Without a healthcheck, `up --wait` only waits for "running", not "working"
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
